name: 问题反馈
description: 报告可复现的功能错误
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: DevTools 版本
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS 版本与芯片
      placeholder: macOS 14.8，Apple M1 / Intel
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与示例输入
      description: 请使用脱敏示例，不要粘贴密码、令牌或内部业务数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附截图或错误提示。
    validations:
      required: true
